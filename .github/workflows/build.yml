name: Build Avode Padimate IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.5.0'

    - name: Build iOS Simulator App
      run: |
        # Swift dosyalarımızı derlemek için geçici bir dizin oluşturalım
        mkdir -p Payload/AvodePadimate.app
        
        # Swift dosyalarını uygulama paketinin içine kopyalayalım
        cp *.swift Payload/AvodePadimate.app/ || true
        
        # Basit bir Info.plist (uygulama kimlik dosyası) oluşturalım ki iOS bunu geçerli bir uygulama bilsin
        cat << 'EOF' > Payload/AvodePadimate.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.avodepadimate.app</string>
            <key>CFBundleName</key>
            <string>AvodePadimate</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>2</integer>
            </array>
        </dict>
        </plist>
        EOF
        
        # Doğru formatta .ipa arşivi oluşturalım
        zip -r AvodePadimate.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AvodePadimate-IPA
        path: AvodePadimate.ipa
